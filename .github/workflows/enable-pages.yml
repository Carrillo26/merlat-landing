name: Enable GitHub Pages

# Turns on classic Pages: deploy from branch main, folder / (root).
# The cloud-agent token cannot call the Pages settings API; this job uses
# the workflow token, which can manage Pages when the repo allows it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy from branch main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          echo "Checking Pages for ${repo}"
          set +e
          get_out=$(gh api "repos/${repo}/pages" 2>&1)
          get_code=$?
          set -e
          echo "$get_out"
          if [ "$get_code" -eq 0 ]; then
            echo "Pages site already exists. Ensuring source is main /."
            gh api --method PUT "repos/${repo}/pages" \
              -f build_type=legacy \
              -f "source[branch]=main" \
              -f "source[path]=/"
          else
            echo "Creating Pages site: legacy build, branch main, path /."
            gh api --method POST "repos/${repo}/pages" \
              -f build_type=legacy \
              -f "source[branch]=main" \
              -f "source[path]=/"
          fi
          echo "Pages configuration:"
          gh api "repos/${repo}/pages" --jq '{html_url:.html_url,status:.status,build_type:.build_type,source:.source}'
